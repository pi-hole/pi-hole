name: Test Supported Distributions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  smoke-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0 # Differential ShellCheck requires full git history

      - name: Check scripts in repository are executable
        run: |
          IFS=$'\n';
          for f in $(find . -name '*.sh' -o -name '*.bats'); do if [[ ! -x $f ]]; then echo "$f is not executable" && FAIL=1; fi ;done
          unset IFS;
          # If FAIL is 1 then we fail.
          [[ $FAIL == 1 ]] && exit 1 || echo "Scripts are executable!"

      - name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@d965e66ec0b3b2f821f75c8eff9b12442d9a7d1e #v5.5.6
        with:
          severity: warning
          display-engine: sarif-fmt

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 #v3.94.3
        with:
          extra_args: --results=verified,unknown

      - name: Spell-Checking
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 #v2.2
        with:
          ignore_words_file: .codespellignore

      - name: Get editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c #v2.2.0

      - name: Run editorconfig-checker
        run: editorconfig-checker

  distro-test-amd64:
    name: distro-test (linux/amd64, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: &distros
          - debian_11
          - debian_12
          - debian_13
          - ubuntu_20
          - ubuntu_22
          - ubuntu_24
          - centos_9
          - centos_10
          - fedora_40
          - fedora_41
          - fedora_42
          - fedora_43
          - alpine_3_21
          - alpine_3_22
          - alpine_3_23
    steps:
      - &step-checkout
        name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - &step-qemu
        name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a #v4.0.0

      - &step-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/amd64)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/amd64 bash test/run.sh

  distro-test-386:
    name: distro-test (linux/386, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: *distros
        exclude:
          # No linux/386 image available for these distros
          - distro: ubuntu_20
          - distro: ubuntu_22
          - distro: ubuntu_24
          - distro: fedora_40
          - distro: fedora_41
          - distro: fedora_42
          - distro: fedora_43
          - distro: centos_9
          - distro: centos_10
    steps:
      - *step-checkout
      - *step-qemu
      - *step-buildx

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/386)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/386 bash test/run.sh

  distro-test-armv6:
    name: distro-test (linux/arm/v6, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: *distros
        exclude:
          # No linux/arm/v6 image available for these distros
          - distro: debian_11
          - distro: ubuntu_20
          - distro: ubuntu_22
          - distro: ubuntu_24
          - distro: fedora_40
          - distro: fedora_41
          - distro: fedora_42
          - distro: fedora_43
          - distro: centos_9
          - distro: centos_10
    steps:
      - *step-checkout
      - *step-qemu
      - *step-buildx

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/arm/v6)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/arm/v6 bash test/run.sh

  distro-test-armv7:
    name: distro-test (linux/arm/v7, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: *distros
        exclude:
          # No linux/arm/v7 image available for these distros
          - distro: fedora_40
          - distro: fedora_41
          - distro: fedora_42
          - distro: fedora_43
          - distro: centos_9
          - distro: centos_10
    steps:
      - *step-checkout
      - *step-qemu
      - *step-buildx

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/arm/v7)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/arm/v7 bash test/run.sh

  distro-test-arm64:
    name: distro-test (linux/arm64/v8, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: *distros
    steps:
      - *step-checkout
      - *step-qemu
      - *step-buildx

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/arm64/v8)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/arm64/v8 bash test/run.sh

  distro-test-riscv64:
    name: distro-test (linux/riscv64, ${{ matrix.distro }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        distro: *distros
        exclude:
          # No linux/riscv64 image available for these distros
          - distro: debian_11
          - distro: debian_12
          - distro: ubuntu_20
          - distro: fedora_40
          - distro: fedora_41
          - distro: fedora_42
          - distro: fedora_43
          - distro: centos_9
          - distro: centos_10
    steps:
      - *step-checkout
      - *step-qemu
      - *step-buildx

      - name: Run BATS test suite for ${{ matrix.distro }} (linux/riscv64)
        run: DISTRO=${{ matrix.distro }} PLATFORM=linux/riscv64 bash test/run.sh
