name: Agent Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'advanced/Scripts/pihole_agent/**'
      - 'test/test_agent_*.py'
      - '.github/workflows/test-agent.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1

jobs:
  agent-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install tomli; # backport for Python <3.11

      - name: Run agent unit tests
        run: |
          PYTHONPATH=advanced/Scripts pytest test/test_agent_*.py -v --noconftest

  agent-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5.6.0
        with:
          python-version: '3.12'

      - name: Install black
        run: pip install black

      - name: Check formatting
        run: black --check test/test_agent_*.py advanced/Scripts/pihole_agent/
