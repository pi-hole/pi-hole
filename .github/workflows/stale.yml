name: Mark stale issues

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  issue_comment: # zizmor: ignore[dangerous-triggers] only uses the issue number, never PR code

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  stale_label: stale

permissions: {}

jobs:
  stale_action:
    name: stale_action
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-slim
    permissions:
      issues: write # to label, comment on and close issues

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 #v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 5
          stale-issue-message: 'This issue is stale because it has been open 30 days with no activity. Please comment or update this issue or it will be closed in 5 days.'
          stale-issue-label: '${{ env.stale_label }}'
          exempt-issue-labels: 'Internal, Fixed in next release, Bug: Confirmed, Documentation Needed, never-stale'
          exempt-all-issue-assignees: true
          operations-per-run: 300
          close-issue-reason: 'not_planned'

  remove_stale:
    name: remove_stale
    # trigger "stale" removal immediately when stale issues are commented on
    # we need to explicitly check that the trigger does not run on comment on a PR as
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#issue_comment-on-issues-only-or-pull-requests-only
    if: ${{ !github.event.issue.pull_request && github.event_name != 'schedule' }}
    permissions:
      issues: write # to edit issues label
    runs-on: ubuntu-slim
    steps:
      - name: Remove 'stale' label
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "$STALE_LABEL"
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STALE_LABEL: ${{ env.stale_label }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
